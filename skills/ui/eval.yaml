# skillgrade evaluation for the ui skill (code-generation archetype).
# Layout: instructions/, graders/, rubrics/, solutions/ — see docs/eval-guidelines.md.
# Usage:
#   skillgrade --smoke --ci --provider=local
#   skillgrade --validate
#
# Documentation: https://github.com/mgechev/skillgrade#readme

version: "1"

defaults:
  agent: command # gemini | claude | codex | acp | opencode | command
  command: opencode run
  provider: local # docker also works; add python3 to docker.setup for the grader
  trials: 5 # number of independent runs per task
  timeout: 300 # seconds before the agent is killed
  threshold: 0.8 # minimum pass rate for --ci mode

tasks:
  - name: checkout-card
    instruction: instructions/checkout-card.md   # FILE REFERENCE - content auto-loaded
    solution: solutions/reference-checkout-card # bash script reproducing the artifact (for --validate)
    graders:
      - type: deterministic
        run: python3 graders/check.py           # FILE-based grader (runs in the workspace)
        weight: 0.7
      - type: llm_rubric
        rubric: rubrics/quality.md              # FILE REFERENCE - content auto-loaded
        weight: 0.3
