name: Deploy gallery to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/build-site.py"
      - "scripts/site_markdown.py"
      - "scripts/site-template.html"
      - "site/index.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    # Guards the committed copy: site/index.html must match skills/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify the committed gallery matches skills/
        run: python3 scripts/build-site.py --check

  build:
    # A stale committed page blocks the deployment.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the gallery
        run: python3 scripts/build-site.py

      - uses: actions/configure-pages@v6
        with:
          # Enables Pages for the repository when it is not set up yet.
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
