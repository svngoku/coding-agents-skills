name: Deploy gallery to GitHub Pages

# One-time setup on a fresh repository: set Settings -> Pages -> Source to
# "GitHub Actions". The configure-pages step below tries to create the site
# automatically, but the default GITHUB_TOKEN cannot administer the repository,
# so the first run fails with "Resource not accessible by integration" until the
# Pages site exists.

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/build-site.py"
      - "scripts/site_markdown.py"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    # Guards the committed payload: site/public/gallery.json must match skills/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify the committed payload matches skills/
        run: python3 scripts/build-site.py --check

  build:
    # A stale payload blocks the deployment.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Regenerate the gallery payload
        run: python3 scripts/build-site.py

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install app dependencies
        working-directory: site
        run: npm ci

      - name: Build the gallery app
        working-directory: site
        run: npm run build

      - uses: actions/configure-pages@v6
        with:
          # Enables Pages for the repository when it is not set up yet.
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
