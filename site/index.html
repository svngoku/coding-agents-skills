<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coding Agents Skills — Gallery</title>
    <meta
      name="description"
      content="Browse the skills in svngoku/coding-agents-skills: capabilities, reference guides, scripts, evaluations and full documentation."
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Resolve the theme before first paint so dark never flashes light.
      (function () {
        try {
          var root = document.documentElement;
          var stored = localStorage.getItem("cas-theme");
          var prefersDark =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark = stored ? stored === "dark" : Boolean(prefersDark);
          root.classList.toggle("dark", isDark);
          root.setAttribute("data-theme", isDark ? "dark" : "light");
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        This gallery needs JavaScript. The skills themselves live in
        <a href="https://github.com/svngoku/coding-agents-skills">the repository</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
